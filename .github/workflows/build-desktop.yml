name: Build & Release Desktop Application

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Package Desktop App
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            npm run electron:dist -- --linux AppImage
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run electron:dist -- --win nsis
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run electron:dist -- --mac dmg
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist-electron/**/*.exe
            dist-electron/**/*.msi
            dist-electron/**/*.AppImage
            dist-electron/**/*.deb
            dist-electron/**/*.rpm
            dist-electron/**/*.dmg
            dist-electron/**/*.zip
            dist-electron/**/*.blockmap
            dist-electron/latest*.yml
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.blockmap
            release-assets/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}