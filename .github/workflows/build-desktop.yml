name: Build & Package Desktop Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Package Desktop App for ${{ matrix.os }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            npm run electron:dist -- --linux AppImage
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            npm run electron:dist -- --win nsis
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run electron:dist -- --mac dmg
          fi
        shell: bash

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Build-${{ matrix.os }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.AppImage
            dist-electron/*.zip
          if-no-files-found: warn
